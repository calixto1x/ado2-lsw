<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Banco SENAC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container" id="caixa-principal">
        <h2 id="titulo-banco">Carregando...</h2>
        
        <input type="text" id="input-conta" placeholder="Digite sua conta">
        <input type="password" id="input-senha" placeholder="Digite sua senha">
        
        <!-- O botão já está no HTML, mas começa escondido via CSS -->
        <button id="btn-entrar" class="escondido">Entrar na Conta</button>
        
        <div id="mensagem-aviso"></div>
    </div>

    <script src="script.js"></script>
    <script src="validador.js"></script>
</body>
</html>
